<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CryptoShield{% endblock %}</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --text:#111318; --muted:#5b6270;
    --border:#e2e4e9; --accent:#4f46e5; --good:#15803d; --bad:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       margin:0;padding:24px;display:flex;justify-content:center;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;
        width:100%;max-width:400px;margin-top:6vh;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 20px;}
  label{display:block;font-size:.8rem;color:var(--muted);margin:14px 0 6px;}
  input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font:inherit;}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:none;border-radius:8px;
         padding:11px 16px;font-weight:600;font-size:.9rem;cursor:pointer;}
  button:hover{opacity:.88;}
  .msg{padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px;}
  .msg.error{background:#fef2f2;color:var(--bad);border:1px solid #fecaca;}
  .msg.success{background:#f0fdf4;color:var(--good);border:1px solid #bbf7d0;}
  .alt{text-align:center;font-size:.85rem;color:var(--muted);margin:18px 0 0;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div class="card">
  <h1>🛡️ CryptoShield</h1>
  <p class="sub">Secure Data Protection System</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="msg {{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
